app = "iapmpy"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  FLASK_DEBUG = "False"
  FLASK_PORT = "3000"
  APP_REQUIRE_AUTH = "true"
  APP_BASIC_AUTH_USER = "admin"
  LLM_BASE_URL = "https://api.openai.com/v1"
  LLM_MODEL_NAME = "gpt-4o-mini"

[http_service]
  auto_start_machines = true
  auto_stop_machines = "off"
  force_https = true
  internal_port = 3000
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "10s"

[mounts]
  source = "iapmpy_data"
  destination = "/app/backend/uploads"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "2048mb"
