app = "iapmpy"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  FLASK_DEBUG = "False"
  FLASK_HOST = "0.0.0.0"
  FLASK_PORT = "5001"

[http_service]
  auto_start_machines = true
  auto_stop_machines = true
  force_https = true
  internal_port = 3000
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
