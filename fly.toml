app = "iapmpy"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  FLASK_DEBUG = "False"
  FLASK_PORT = "3000"
  APP_REQUIRE_AUTH = "true"
  APP_BASIC_AUTH_USER = "admin"
  LLM_BASE_URL = "https://api.openai.com/v1"
  LLM_MODEL_NAME = "gpt-4o-mini"
  # Prevent TwHIN-BERT from loading locally into this 2 GiB VM.
  # random = no local recommendation model; twitter / twhin-bert need more RAM.
  OASIS_TWITTER_RECSYS = "random"
  OASIS_MAX_CONCURRENT_LLM_ACTIONS = "2"
  OASIS_MACHINE_MEMORY_MB = "2048"
  OASIS_MAX_PROFILES = "45"
  OASIS_MAX_ACTIVE_AGENTS_PER_ROUND = "2"
  APP_REQUIRE_AUTH = "true"
  TOKENIZERS_PARALLELISM = "false"
  OMP_NUM_THREADS = "1"
  OPENBLAS_NUM_THREADS = "1"
  MKL_NUM_THREADS = "1"
  MALLOC_ARENA_MAX = "2"

[http_service]
  auto_start_machines = true
  auto_stop_machines = "off"
  force_https = true
  internal_port = 3000
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "10s"

[mounts]
  source = "iapmpy_data"
  destination = "/app/backend/uploads"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "2048mb"
