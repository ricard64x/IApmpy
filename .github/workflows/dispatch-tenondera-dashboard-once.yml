name: One-time protected Dashboard UX release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-tenondera-dashboard-once.yml
permissions:
  contents: read
  actions: write
jobs:
  request-protected-release:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'chore: dispatch verified Dashboard UX release'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify exact tested UI and no unrelated code changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
          MERGED: 0020ff3eb32f81be5022258d73976ce8d15e2b21
          TESTED: e35aa965e54ce698b4ed3b051f35a393344a8b9a
        shell: bash
        run: |
          set -euo pipefail
          only_dispatcher="$(gh api "repos/$REPO/compare/$MERGED...$TARGET" --jq '(.ahead_by == 1) and ((.files | length) == 1) and (.files[0].filename == ".github/workflows/dispatch-tenondera-dashboard-once.yml")')"
          test "$only_dispatcher" = "true"
          ci="$(gh api "repos/$REPO/actions/runs?head_sha=$TESTED&per_page=30" --jq '.workflow_runs | map(select(.name == "Verify IApmpy Fly deployment" and .event == "pull_request")) | .[0].conclusion // "missing"')"
          test "$ci" = "success"
          current="$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')"
          test "$current" = "$TARGET"
      - name: Dispatch existing protected production workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -X POST "repos/$REPO/actions/workflows/deploy-fly.yml/dispatches" -f ref=main
          echo "Production deploy requested via environment-protected workflow."
