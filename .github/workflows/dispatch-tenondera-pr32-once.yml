name: One-time dispatch of validated Tenondera PR32
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-tenondera-pr32-once.yml
permissions:
  contents: read
  actions: write
jobs:
  request-protected-deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'fix: repo-scoped one-time Tenondera production dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify app code unchanged since successful production CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
          VERIFIED: 8205fa139e40c9ae7074c41dea4f9cfcfd2a21f7
        shell: bash
        run: |
          set -euo pipefail
          only_dispatcher_changed="$(gh api "repos/$REPO/compare/$VERIFIED...$TARGET" --jq '(.ahead_by == 1) and ((.files | length) == 1) and (.files[0].filename == ".github/workflows/dispatch-tenondera-pr32-once.yml")')"
          test "$only_dispatcher_changed" = "true"
          previous_ci="$(gh api "repos/$REPO/actions/runs?head_sha=$VERIFIED&per_page=30" --jq '.workflow_runs | map(select(.name == "Verify IApmpy Fly deployment" and .event == "push")) | .[0].conclusion // "missing"')"
          test "$previous_ci" = "success"
          current="$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')"
          test "$current" = "$TARGET"
      - name: Request existing environment-protected Fly.io deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -X POST "repos/$REPO/actions/workflows/deploy-fly.yml/dispatches" -f ref=main
          echo "Protected deployment workflow dispatched."
