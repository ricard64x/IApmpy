name: Deploy IApmpy to Fly.io

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Verify IApmpy Fly deployment"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: iapmpy-fly-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
      - name: Confirm exact tested revision
        if: github.event_name == 'workflow_run'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"
      - name: Verify deploy token is configured
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo 'Missing GitHub Actions repository secret FLY_API_TOKEN' >&2
            exit 1
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy latest main image to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --ha=false -a iapmpy
      - name: Show deployed app status
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl status -a iapmpy
