name: Deploy IApmpy to Fly.io

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iapmpy-fly-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Verify deploy token is configured
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo 'Missing GitHub Actions repository secret FLY_API_TOKEN' >&2
            exit 1
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy latest main image to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --ha=false -a iapmpy
      - name: Show deployed app status
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl status -a iapmpy
