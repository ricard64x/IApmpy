name: Cancel confirmed stale Fly recovery deployment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cancel-stale-iapmpy-deploy.yml

permissions:
  contents: read
  actions: write

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only previously inspected stale deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          OLD=45083474157
          URL="https://api.github.com/repos/${{ github.repository }}/actions/runs/$OLD"
          JSON="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$URL")"
          STATUS="$(echo "$JSON" | jq -r '.status')"
          SHA="$(echo "$JSON" | jq -r '.head_sha')"
          echo "Stale candidate status: $STATUS"
          if [ "$STATUS" = "completed" ]; then echo "Already completed"; exit 0; fi
          test "$SHA" = "bea4d22394822b75bda51b7ea967461cba38e00a" || { echo "Different run identity: refusing cancellation"; exit 1; }
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$URL/force-cancel"
          echo "Force-cancellation requested for already-cancelled but still-active run $OLD"
