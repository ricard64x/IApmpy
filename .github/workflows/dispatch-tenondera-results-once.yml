name: One-time protected release for explainable Tenondera results
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-tenondera-results-once.yml
permissions:
  contents: read
  actions: write
jobs:
  request-release:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'chore: request protected results UX production deployment'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify exact tested code and single dispatcher change
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
          MERGED: 1c59565bcf0f6e8f02abebd33fc0cd0ac411b637
          TESTED: 276e4e066fe57a37ee429625283a1c677e2046e6
        shell: bash
        run: |
          set -euo pipefail
          only_dispatcher="$(gh api "repos/$REPO/compare/$MERGED...$TARGET" --jq '(.ahead_by == 1) and ((.files | length) == 1) and (.files[0].filename == ".github/workflows/dispatch-tenondera-results-once.yml")')"
          test "$only_dispatcher" = "true"
          pr_ci="$(gh api "repos/$REPO/actions/runs?head_sha=$TESTED&per_page=30" --jq '.workflow_runs | map(select(.name == "Verify IApmpy Fly deployment" and .event == "pull_request")) | .[0].conclusion // "missing"')"
          test "$pr_ci" = "success"
          current="$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')"
          test "$current" = "$TARGET"
      - name: Dispatch existing environment-protected Fly.io production workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -X POST "repos/$REPO/actions/workflows/deploy-fly.yml/dispatches" -f ref=main
          echo "Protected production deployment requested."
