name: One-time protected release for Tenondera dialogue graph
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-tenondera-dialogues-once.yml
permissions:
  contents: read
  actions: write
jobs:
  request-protected-release:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message == 'chore: dispatch verified conversation improvements release'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify exact code tested and no unrelated changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET: ${{ github.sha }}
          MERGED: b42a4350748579459f3cf1cae70a9a48c3a35691
          TESTED: f73e0713642b8e6a03610122966868e83bf8f0ce
        shell: bash
        run: |
          set -euo pipefail
          only_dispatcher="$(gh api "repos/$REPO/compare/$MERGED...$TARGET" --jq '(.ahead_by == 1) and ((.files | length) == 1) and (.files[0].filename == ".github/workflows/dispatch-tenondera-dialogues-once.yml")')"
          test "$only_dispatcher" = "true"
          pr_ci="$(gh api "repos/$REPO/actions/runs?head_sha=$TESTED&per_page=30" --jq '.workflow_runs | map(select(.name == "Verify IApmpy Fly deployment" and .event == "pull_request")) | .[0].conclusion // "missing"')"
          test "$pr_ci" = "success"
          current="$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')"
          test "$current" = "$TARGET"
      - name: Dispatch existing environment-protected Fly.io workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -X POST "repos/$REPO/actions/workflows/deploy-fly.yml/dispatches" -f ref=main
          echo "Production Fly.io deployment requested through protected workflow."
