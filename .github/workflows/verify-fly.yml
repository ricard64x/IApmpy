name: Verify IApmpy Fly deployment

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel obsolete Docker builds on new commits to the same pull request.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate Spanish translations
        run: python3 scripts/validate_spanish_locale.py
      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          node --test frontend/tests/projectHistory.test.mjs
      - name: Check Python syntax
        run: python3 -m compileall -q backend/app backend/wsgi.py
      - name: Validate lightweight GPT simulation without external calls
        run: python3 -m unittest discover -s tests -p 'test_lightweight_simulation.py' -v

      - name: Validate low-memory OASIS configuration
        run: python3 -m unittest discover -s tests -p 'test_oasis_runtime.py' -v
      - name: Build production container
        run: docker build -t iapmpy:test .
      - name: Verify HTTP startup and access control
        run: |
          docker run -d --name iapmpy-smoke -p 3000:3000 -e FLASK_DEBUG=true -e LLM_API_KEY=dummy-ci-key -e ZEP_API_KEY=dummy-ci-key -e APP_REQUIRE_AUTH=true -e APP_BASIC_AUTH_USER=admin -e APP_BASIC_AUTH_PASSWORD=dummy-ci-password iapmpy:test
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 3
          done
          curl --fail http://127.0.0.1:3000/health
          echo "SPA root status: $(curl -s -o /tmp/tenondera-root.html -w '%{http_code}' http://127.0.0.1:3000/)"
          echo "SPA root bytes: $(wc -c < /tmp/tenondera-root.html)"
          grep -iq '<html' /tmp/tenondera-root.html
          echo "Unauthenticated API status: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/auth/me)"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/auth/me)" = 401
          echo "Login/API verification follows"
          curl -fsS -c /tmp/tenondera-test-cookies -H 'Content-Type: application/json' -d '{"username":"admin","password":"dummy-ci-password"}' http://127.0.0.1:3000/api/auth/login > /tmp/tenondera-session.json
          CSRF=$(python3 -c 'import json;print(json.load(open("/tmp/tenondera-session.json"))["data"]["csrf"])')
          test -n "$CSRF"
          echo "Authenticated API status: $(curl -s -b /tmp/tenondera-test-cookies -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/auth/me)"
          curl -fsS -b /tmp/tenondera-test-cookies http://127.0.0.1:3000/api/auth/me | python3 -c 'import json,sys; assert json.load(sys.stdin)["success"] is True'
          test "$(curl -s -b /tmp/tenondera-test-cookies -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/graph/project/list)" = 403
          curl -fsS -b /tmp/tenondera-test-cookies -c /tmp/tenondera-test-cookies -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' -d '{"current_password":"dummy-ci-password","new_password":"dummy-ci-password-rotated"}' http://127.0.0.1:3000/api/auth/password >/dev/null
          curl -fsS -c /tmp/tenondera-test-cookies -H 'Content-Type: application/json' -d '{"username":"admin","password":"dummy-ci-password-rotated"}' http://127.0.0.1:3000/api/auth/login >/dev/null
          curl -fsS -b /tmp/tenondera-test-cookies http://127.0.0.1:3000/api/capacity/status | grep -q 'recommended_max_profiles'
          docker exec iapmpy-smoke /app/backend/.venv/bin/python -m unittest discover -s tests -p 'test_tenondera_auth.py' -v
          docker exec iapmpy-smoke /app/backend/.venv/bin/python -m unittest discover -s tests -p 'test_execution_*.py' -v
          docker exec iapmpy-smoke /app/backend/.venv/bin/python -m unittest discover -s tests -p 'test_report_interactions.py' -v
          docker exec iapmpy-smoke /app/backend/.venv/bin/python -m unittest discover -s tests -p 'test_report_localization.py' -v
          docker exec iapmpy-smoke /app/backend/.venv/bin/python -m unittest discover -s tests -p 'test_graph_ingestion_optimizer.py' -v
          docker exec iapmpy-smoke /app/backend/.venv/bin/python -m unittest discover -s tests -p 'test_getangiru_*.py' -v
      - name: Verify installed OASIS 0.2.5 uses lightweight Twitter
        run: |
          docker exec \
            -e OASIS_TWITTER_RECSYS=random \
            -e OASIS_MAX_CONCURRENT_LLM_ACTIONS=2 \
            iapmpy-smoke /app/backend/.venv/bin/python -c '
          import os, tempfile
          from scripts.oasis_runtime import make_oasis_env
          with tempfile.TemporaryDirectory() as root:
              env = make_oasis_env(
                  agent_graph=object(),
                  platform="twitter",
                  db_path=os.path.join(root, "twitter.db"),
              )
              assert env.platform.recsys_type.value == "random"
              assert env.llm_semaphore._value == 2
              from oasis.social_platform import recsys
              assert recsys.twhin_model is None
              env.platform.db_cursor.close()
              env.platform.db.close()
          print("Real OASIS random mode: OK; TwHIN-BERT model not loaded.")
          '
      - name: Run actual Chromium visual and interaction smoke
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.0
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME_BIN" || { echo "Chrome no está instalado en el ejecutor"; exit 1; }
          echo "Navegador de pruebas: $CHROME_BIN"
          CHROME_BIN="$CHROME_BIN" node tests/browser_visual_smoke.cjs
      - name: Upload visual browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenondera-browser-visual-qa
          path: artifacts/ui-qa/
          if-no-files-found: ignore
      - name: Container logs on failure
        if: failure()
        run: docker logs iapmpy-smoke --tail 100 || true
