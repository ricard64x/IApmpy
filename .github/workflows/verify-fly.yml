name: Verify IApmpy Fly deployment

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate Spanish translations
        run: python3 scripts/validate_spanish_locale.py
      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
      - name: Check Python syntax
        run: python3 -m compileall -q backend/app backend/wsgi.py
      - name: Validate low-memory OASIS configuration
        run: python3 -m unittest discover -s tests -p 'test_oasis_runtime.py' -v
      - name: Build production container
        run: docker build -t iapmpy:test .
      - name: Verify HTTP startup and access control
        run: |
          docker run -d --name iapmpy-smoke -p 3000:3000 -e LLM_API_KEY=dummy-ci-key -e ZEP_API_KEY=dummy-ci-key -e APP_REQUIRE_AUTH=true -e APP_BASIC_AUTH_USER=admin -e APP_BASIC_AUTH_PASSWORD=dummy-ci-password iapmpy:test
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 3
          done
          curl --fail http://127.0.0.1:3000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = 401
          curl --fail --user admin:dummy-ci-password http://127.0.0.1:3000/ | grep -iq '<html'
      - name: Verify installed OASIS 0.2.5 uses lightweight Twitter
        run: |
          docker exec \
            -e OASIS_TWITTER_RECSYS=random \
            -e OASIS_MAX_CONCURRENT_LLM_ACTIONS=2 \
            iapmpy-smoke /app/backend/.venv/bin/python -c '
          import os, tempfile
          from scripts.oasis_runtime import make_oasis_env
          with tempfile.TemporaryDirectory() as root:
              env = make_oasis_env(
                  agent_graph=object(),
                  platform="twitter",
                  db_path=os.path.join(root, "twitter.db"),
              )
              assert env.platform.recsys_type.value == "random"
              assert env.llm_semaphore._value == 2
              from oasis.social_platform import recsys
              assert recsys.twhin_model is None
              env.platform.db_cursor.close()
              env.platform.db.close()
          print("Real OASIS random mode: OK; TwHIN-BERT model not loaded.")
          '
      - name: Container logs on failure
        if: failure()
        run: docker logs iapmpy-smoke --tail 100 || true
